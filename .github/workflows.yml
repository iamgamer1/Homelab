name: Validate Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check Markdown files exist
        run: |
          echo "Checking repository structure..."
          ls -la
          echo "Docs:"
          ls docs/
          echo "Scripts:"
          ls scripts/
          echo "Configs:"
          ls -R configs/
          echo "All checks passed!"
